name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --group dev --locked
      - run: uv run just lint-check
      - run: uv run just typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # The recipe notebooks render their graphs, and the graph tests skip without it.
      - uses: ts-graphviz/setup-graphviz@v2
      - run: uv sync --group dev --locked
      - run: uv run just test-cov
